[functions]
  included_files = ["_public/search-index.json", "_src/_data/packages.json"]

[functions."orb-chat"]
  timeout = 60

[functions."orb-chat-progress"]
  # V2 tracing cannot see the SDK require inside the bundled legacy handler.
  included_files = ["node_modules/openai/**"]

[functions."orb-realtime-session"]
  timeout = 30

[functions."orb-realtime-tool"]
  timeout = 30

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/api/mcp"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/api/mcp/search-content"
  to = "/.netlify/functions/mcp-search-content"
  status = 200

[[redirects]]
  from = "/api/mcp/get-content-by-url"
  to = "/.netlify/functions/mcp-get-content-by-url"
  status = 200

[[redirects]]
  from = "/api/mcp/sysapps/list-devices"
  to = "/.netlify/functions/mcp-sysapps-list-devices"
  status = 200

[[redirects]]
  from = "/api/mcp/sysapps/get-device-apps"
  to = "/.netlify/functions/mcp-sysapps-get-device-apps"
  status = 200

[[redirects]]
  from = "/api/mcp/sysapps/search"
  to = "/.netlify/functions/mcp-sysapps-search"
  status = 200

[[redirects]]
  from = "/api/mcp/sysapps/compare-devices"
  to = "/.netlify/functions/mcp-sysapps-compare-devices"
  status = 200

[[redirects]]
  from = "/api/orb-chat"
  to = "/.netlify/functions/orb-chat"
  status = 200

[[redirects]]
  from = "/api/orb-popular"
  to = "/.netlify/functions/orb-popular"
  status = 200

[[redirects]]
  from = "/api/orb-realtime-session"
  to = "/.netlify/functions/orb-realtime-session"
  status = 200

[[redirects]]
  from = "/api/orb-realtime-tool"
  to = "/.netlify/functions/orb-realtime-tool"
  status = 200

# Keep the build on Node 22. The draft function runtime is set independently
# through Netlify's draft-only AWS_LAMBDA_JS_RUNTIME environment variable.
[context.draft]
  command = "node -p process.version && eleventy && node scripts/create-mika-draft-profiler.cjs"

[context.draft.environment]
  NODE_VERSION = "22"
